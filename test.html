<!doctype html>
<html lang="de" class="force-motion">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Test — Gesicht auf dem Tuch</title>
  </head>
  <body>
    <main class="face-test">
      <canvas id="face-cloth"></canvas>
      <div class="face-bounds">
        <div class="face-box" aria-hidden="true"></div>
      </div>
      <div class="face-tools">
        <label class="face-btn">
          Foto wählen
          <input type="file" accept="image/*" hidden />
        </label>
        <button class="face-btn" type="button" data-save hidden>Bild speichern</button>
      </div>
      <p class="face-hint" aria-live="polite">Zieh am Tuch · oder zieh ein Foto hier rein</p>
      <div class="face-drop" hidden>Foto loslassen</div>
    </main>
    <script type="module" src="/src/test/face-cloth.ts"></script>
  </body>
</html>
