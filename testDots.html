<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Test — Gesicht aus Punkten</title>
  </head>
  <body>
    <main class="face-test dots-test">
      <canvas class="dots-canvas" aria-label="Kevins Gesicht aus Punkten, mit Finger oder Maus auseinanderschiebbar"></canvas>
      <div class="face-tools">
        <div class="face-pick" role="group" aria-label="Foto">
          <button class="face-btn" type="button" data-face="front" aria-pressed="true">Frontal</button>
          <button class="face-btn" type="button" data-face="left" aria-pressed="false">Links</button>
          <button class="face-btn" type="button" data-face="right" aria-pressed="false">Rechts</button>
          <button class="face-btn" type="button" data-face="look" aria-pressed="false">Blick</button>
          <button class="face-btn" type="button" data-face="side" aria-pressed="false">Seite</button>
        </div>
        <div class="face-pick" role="group" aria-label="Darstellung">
          <button class="face-btn" type="button" data-mode="dots" aria-pressed="true">Punkte</button>
          <button class="face-btn" type="button" data-mode="ascii" aria-pressed="false">ASCII</button>
        </div>
        <label class="face-btn">
          Foto wählen
          <input type="file" accept="image/*" hidden />
        </label>
      </div>
      <p class="face-hint" aria-live="polite">Wisch durchs Gesicht · Test-Seite, nicht verlinkt</p>
      <div class="face-drop" hidden>Foto loslassen</div>
    </main>
    <script type="module" src="/src/test/face-dots.ts"></script>
  </body>
</html>
