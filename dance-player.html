<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Random Dance Player</title>
<style>
  :root {
    --bg: #0d0d0f;
    --ink: antiquewhite;
    --accent: mediumpurple;
    --muted: color-mix(in srgb, var(--ink) 45%, transparent);
    box-sizing: border-box;
  }
  * { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
    gap: 1.25rem;
  }
  h1 { font-weight: 500; letter-spacing: -0.02em; font-size: 1.4rem; margin: 0; }

  .stage {
    width: min(340px, 90vw);
    height: 220px;
    display: grid;
    place-items: end center;
    position: relative;
    overflow: hidden;
    border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent);
    border-radius: 16px;
  }
  .floor {
    position: absolute; bottom: 26px; left: 22%; right: 22%;
    height: 1px; background: color-mix(in srgb, var(--ink) 12%, transparent);
  }
  .caption { min-height: 1.4em; color: var(--muted); font-size: 0.95rem; letter-spacing: 0.01em; }

  .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; max-width: 420px; }
  button {
    background: none; border: 1px solid color-mix(in srgb, var(--ink) 28%, transparent);
    color: var(--ink); font: inherit; font-size: 0.85rem;
    padding: 0.35rem 0.8rem; border-radius: 999px; cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Dancer base ---------- */
  .dancer { width: 96px; height: 128px; color: var(--accent); position: relative; bottom: 26px; }
  .dancer g { transform-box: view-box; }
  .figure { transform-origin: 60px 90px; }
  .body   { transform-origin: 60px 95px; }
  .head   { transform-origin: 60px 40px; }
  .arm-l, .arm-r { transform-origin: 60px 46px; }
  .leg-l, .leg-r { transform-origin: 60px 95px; }

  /* ========== TRANSITION (läuft immer zwischen zwei Moves) ========== */
  /* Pirouette: hüpft hoch, dreht einmal über scaleX, landet neutral. */
  .t-active .figure { animation: tr-turn 0.7s ease-in-out both; }
  @keyframes tr-turn {
    0%   { transform: translateY(0)     scaleX(1); }
    25%  { transform: translateY(-11px) scaleX(0.3); }
    50%  { transform: translateY(-15px) scaleX(-1); }
    75%  { transform: translateY(-11px) scaleX(-0.3); }
    100% { transform: translateY(0)     scaleX(1); }
  }

  /* ========== 1) MOONWALK ========== */
  .m-moonwalk .figure { animation: mw-slide 3.2s ease-in-out infinite; }
  .m-moonwalk .body   { animation: mw-lean  3.2s ease-in-out infinite; }
  .m-moonwalk .arm-l  { animation: mw-armL  1.6s ease-in-out infinite; }
  .m-moonwalk .arm-r  { animation: mw-armR  1.6s ease-in-out infinite; }
  .m-moonwalk .leg-l  { animation: mw-legL  0.8s ease-in-out infinite; }
  .m-moonwalk .leg-r  { animation: mw-legR  0.8s ease-in-out infinite; }
  @keyframes mw-slide { 0%{transform:translateX(42px)} 50%{transform:translateX(-42px)} 100%{transform:translateX(42px)} }
  @keyframes mw-lean  { 0%,100%{transform:rotate(9deg)} 50%{transform:rotate(-9deg)} }
  @keyframes mw-armL  { 0%,100%{transform:rotate(-16deg)} 50%{transform:rotate(6deg)} }
  @keyframes mw-armR  { 0%,100%{transform:rotate(16deg)} 50%{transform:rotate(-6deg)} }
  @keyframes mw-legL  { 0%{transform:rotate(-14deg)} 50%{transform:rotate(16deg)} 100%{transform:rotate(-14deg)} }
  @keyframes mw-legR  { 0%{transform:rotate(16deg)} 50%{transform:rotate(-14deg)} 100%{transform:rotate(16deg)} }

  /* ========== 2) SALTO / BACKFLIP ========== */
  .m-salto .figure { animation: sa-flip 2.4s cubic-bezier(.45,0,.55,1) infinite; }
  .m-salto .arm-l  { animation: sa-armL 2.4s ease-in-out infinite; }
  .m-salto .arm-r  { animation: sa-armR 2.4s ease-in-out infinite; }
  .m-salto .leg-l  { animation: sa-legL 2.4s ease-in-out infinite; }
  .m-salto .leg-r  { animation: sa-legR 2.4s ease-in-out infinite; }
  @keyframes sa-flip {
    0%{transform:translateY(0) rotate(0)} 16%{transform:translateY(8px) rotate(0)}
    28%{transform:translateY(-34px) rotate(-70deg)} 42%{transform:translateY(-56px) rotate(-190deg)}
    56%{transform:translateY(-30px) rotate(-300deg)} 66%{transform:translateY(0) rotate(-360deg)}
    72%{transform:translateY(7px) rotate(-360deg)} 80%,100%{transform:translateY(0) rotate(-360deg)}
  }
  @keyframes sa-legL { 0%,16%,80%,100%{transform:rotate(-8deg)} 42%{transform:rotate(-55deg)} }
  @keyframes sa-legR { 0%,16%,80%,100%{transform:rotate(9deg)}  42%{transform:rotate(55deg)} }
  @keyframes sa-armL { 0%,16%,80%,100%{transform:rotate(-30deg)} 42%{transform:rotate(-150deg)} }
  @keyframes sa-armR { 0%,16%,80%,100%{transform:rotate(35deg)}  42%{transform:rotate(150deg)} }

  /* ========== 3) TWIST ========== */
  .m-twist .figure { animation: tw-drop 1.6s ease-in-out infinite; }
  .m-twist .body   { animation: tw-body 1.6s ease-in-out infinite; }
  .m-twist .arm-l  { animation: tw-armL 1.6s ease-in-out infinite; }
  .m-twist .arm-r  { animation: tw-armR 1.6s ease-in-out infinite; }
  .m-twist .leg-l  { animation: tw-legL 1.6s ease-in-out infinite; }
  .m-twist .leg-r  { animation: tw-legR 1.6s ease-in-out infinite; }
  @keyframes tw-drop { 0%,100%{transform:translateY(0)} 25%,75%{transform:translateY(5px)} }
  @keyframes tw-body { 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(15deg)} }
  @keyframes tw-armL { 0%,100%{transform:rotate(34deg)} 50%{transform:rotate(-30deg)} }
  @keyframes tw-armR { 0%,100%{transform:rotate(-34deg)} 50%{transform:rotate(30deg)} }
  @keyframes tw-legL { 0%,100%{transform:rotate(12deg)} 50%{transform:rotate(-7deg)} }
  @keyframes tw-legR { 0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(7deg)} }

  /* ========== 4) BATUSI (Pulp Fiction) ========== */
  .m-batusi .figure { animation: ba-step 1.4s ease-in-out infinite; }
  .m-batusi .body   { animation: ba-sway 1.4s ease-in-out infinite; }
  .m-batusi .arm-l  { animation: ba-armL 0.7s ease-in-out infinite; }
  .m-batusi .arm-r  { animation: ba-armR 0.7s ease-in-out infinite; }
  .m-batusi .leg-l  { animation: ba-legL 1.4s ease-in-out infinite; }
  .m-batusi .leg-r  { animation: ba-legR 1.4s ease-in-out infinite; }
  @keyframes ba-step { 0%,100%{transform:translateX(-7px)} 50%{transform:translateX(7px)} }
  @keyframes ba-sway { 0%,100%{transform:rotate(-7deg)} 50%{transform:rotate(7deg)} }
  @keyframes ba-armL { 0%,100%{transform:rotate(-118deg)} 50%{transform:rotate(-82deg)} }
  @keyframes ba-armR { 0%,100%{transform:rotate(118deg)} 50%{transform:rotate(82deg)} }
  @keyframes ba-legL { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(8deg)} }
  @keyframes ba-legR { 0%,100%{transform:rotate(6deg)} 50%{transform:rotate(-8deg)} }

  /* ========== 5) RUNNING MAN ========== */
  .m-runman .figure { animation: rm-hop 0.5s ease-in-out infinite; }
  .m-runman .body   { animation: rm-lean 1s linear infinite; }
  .m-runman .arm-l  { animation: rm-armL 1s ease-in-out infinite; }
  .m-runman .arm-r  { animation: rm-armR 1s ease-in-out infinite; }
  .m-runman .leg-l  { animation: rm-legL 1s ease-in-out infinite; }
  .m-runman .leg-r  { animation: rm-legR 1s ease-in-out infinite; }
  @keyframes rm-hop  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  @keyframes rm-lean { 0%,100%{transform:rotate(-7deg)} }
  @keyframes rm-armL { 0%{transform:rotate(45deg)} 50%{transform:rotate(-30deg)} 100%{transform:rotate(45deg)} }
  @keyframes rm-armR { 0%{transform:rotate(-30deg)} 50%{transform:rotate(45deg)} 100%{transform:rotate(-30deg)} }
  @keyframes rm-legL { 0%{transform:rotate(-45deg)} 50%{transform:rotate(22deg)} 100%{transform:rotate(-45deg)} }
  @keyframes rm-legR { 0%{transform:rotate(22deg)} 50%{transform:rotate(-45deg)} 100%{transform:rotate(22deg)} }

  /* ========== 6) DISCO POINT (Saturday Night Fever) ========== */
  .m-disco .figure { animation: di-bounce 0.6s ease-in-out infinite; }
  .m-disco .body   { animation: di-lean 1.2s ease-in-out infinite; }
  .m-disco .arm-r  { animation: di-pointR 1.2s ease-in-out infinite; }
  .m-disco .arm-l  { animation: di-pointL 1.2s ease-in-out infinite; }
  .m-disco .leg-l  { animation: di-legL 1.2s ease-in-out infinite; }
  .m-disco .leg-r  { animation: di-legR 1.2s ease-in-out infinite; }
  @keyframes di-bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  @keyframes di-lean   { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
  @keyframes di-pointR { 0%,100%{transform:rotate(-125deg)} 50%{transform:rotate(20deg)} }
  @keyframes di-pointL { 0%,100%{transform:rotate(95deg)} 50%{transform:rotate(-40deg)} }
  @keyframes di-legL   { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(10deg)} }
  @keyframes di-legR   { 0%,100%{transform:rotate(6deg)} 50%{transform:rotate(-10deg)} }

  /* ========== 7) CRIP WALK ========== */
  .m-cwalk .figure { animation: cw-move 1s ease-in-out infinite; }
  .m-cwalk .body   { animation: cw-lean 1s ease-in-out infinite; }
  .m-cwalk .arm-l  { animation: cw-armL 1s ease-in-out infinite; }
  .m-cwalk .arm-r  { animation: cw-armR 1s ease-in-out infinite; }
  .m-cwalk .leg-l  { animation: cw-legL 0.5s ease-in-out infinite; }
  .m-cwalk .leg-r  { animation: cw-legR 0.5s ease-in-out infinite; }
  @keyframes cw-move { 0%,100%{transform:translate(-8px,0)} 50%{transform:translate(8px,-3px)} }
  @keyframes cw-lean { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
  @keyframes cw-armL { 0%,100%{transform:rotate(12deg)} 50%{transform:rotate(-10deg)} }
  @keyframes cw-armR { 0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(10deg)} }
  @keyframes cw-legL { 0%,100%{transform:rotate(-24deg)} 50%{transform:rotate(8deg)} }
  @keyframes cw-legR { 0%,100%{transform:rotate(24deg)} 50%{transform:rotate(-8deg)} }

  @media (prefers-reduced-motion: reduce) {
    .dancer g { animation: none !important; }
  }
</style>
</head>
<body>
  <h1>Random Dance Player</h1>

  <div class="stage">
    <div class="floor"></div>
    <svg class="dancer" id="dancer" viewBox="0 0 120 160" fill="none"
         stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true">
      <g class="figure">
        <g class="body">
          <line x1="60" y1="46" x2="60" y2="95"/>
          <g class="head"><circle cx="60" cy="28" r="12" fill="currentColor" stroke="none"/></g>
          <g class="arm-l"><line x1="60" y1="48" x2="38" y2="72"/></g>
          <g class="arm-r"><line x1="60" y1="48" x2="82" y2="72"/></g>
          <g class="leg-l"><line x1="60" y1="95" x2="46" y2="135"/></g>
          <g class="leg-r"><line x1="60" y1="95" x2="74" y2="135"/></g>
        </g>
      </g>
    </svg>
  </div>

  <div class="caption" id="caption"></div>

  <div class="controls" id="controls"></div>

  <script>
    const MOVES = [
      { cls: "m-moonwalk", label: "Moonwalk" },
      { cls: "m-salto",    label: "Salto" },
      { cls: "m-twist",    label: "Twist" },
      { cls: "m-batusi",   label: "Batusi" },
      { cls: "m-runman",   label: "Running Man" },
      { cls: "m-disco",    label: "Disco Point" },
      { cls: "m-cwalk",    label: "Crip Walk" },
    ];
    const PLAY_MS = 2800;   // wie lange ein Move läuft
    const TRANS_MS = 700;   // Dauer des Übergangs (muss zu tr-turn passen)

    const dancer  = document.getElementById("dancer");
    const caption = document.getElementById("caption");
    const reduce  = matchMedia("(prefers-reduced-motion: reduce)").matches;

    let timer = null;
    let last = null;

    function labelOf(cls) { return (MOVES.find(m => m.cls === cls) || {}).label || ""; }
    function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }
    function pickMove() {
      let m; do { m = MOVES[(Math.random() * MOVES.length) | 0].cls; } while (m === last);
      last = m; return m;
    }

    function applyMove(cls) {
      dancer.className = "dancer " + cls;
      caption.textContent = labelOf(cls);
    }

    function runTransition(then) {
      dancer.className = "dancer t-active";
      caption.textContent = "…";
      void dancer.offsetWidth;           // Reflow -> Animation startet neu
      timer = setTimeout(then, TRANS_MS);
    }

    function randomStep() {
      applyMove(pickMove());
      timer = setTimeout(() => runTransition(randomStep), PLAY_MS);
    }

    function setActiveBtn(cls) {
      for (const b of controls.children) b.classList.toggle("active", b.dataset.cls === cls);
    }

    // --- Steuerung ---
    const controls = document.getElementById("controls");
    const autoBtn = document.createElement("button");
    autoBtn.textContent = "Auto (Random)";
    autoBtn.dataset.cls = "auto";
    autoBtn.addEventListener("click", startRandom);
    controls.append(autoBtn);

    for (const m of MOVES) {
      const b = document.createElement("button");
      b.textContent = m.label;
      b.dataset.cls = m.cls;
      b.addEventListener("click", () => playSolo(m.cls));
      controls.append(b);
    }

    function startRandom() {
      clearTimer(); setActiveBtn("auto");
      if (reduce) { caption.textContent = "Bewegung reduziert"; return; }
      randomStep();
    }
    function playSolo(cls) {
      clearTimer(); setActiveBtn(cls);
      applyMove(cls);
    }

    startRandom();
  </script>
</body>
</html>
